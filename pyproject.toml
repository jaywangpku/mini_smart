[project]
name = "mini-smart"
version = "0.1.0"
description = "Research tool for syncing Longbridge candlestick data into SQLite and viewing it in Vue."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "longbridge>=4.1.0",
  "pydantic>=2",
  "python-dotenv>=1",
  "typer>=0.12",
  "uvicorn[standard]>=0.27"
]

[project.scripts]
mini-smart = "bankend.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bankend"]
